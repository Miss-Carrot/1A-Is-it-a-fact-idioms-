<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idioms: fill in the missing words</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<style>
  :root{
    --bg:#0f1116;
    --card:#1a1d27;
    --border:#2b2f3a;
    --text:#e8e9ee;
    --muted:#9aa0ad;
    --accent:#5b8def;
    --green:#2fbf71;
    --green-bg:#12321f;
    --green-text:#c9f6dc;
    --red:#e6534a;
    --red-bg:#3a1616;
    --red-text:#ffd0cc;
    --input-bg:#12141b;
  }
  html[data-theme="light"]{
    --bg:#f4f5f8;
    --card:#ffffff;
    --border:#dfe2ea;
    --text:#1b1d24;
    --muted:#6b7180;
    --accent:#3763d6;
    --green:#1f9d5c;
    --green-bg:#e4f8ec;
    --green-text:#0f5c33;
    --red:#d63c33;
    --red-bg:#fdeceb;
    --red-text:#8a231c;
    --input-bg:#f9f9fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px 16px 60px;
    transition:background .2s, color .2s;
  }
  .wrap{max-width:820px;margin:0 auto;}
  h1{text-align:center;font-size:1.5rem;margin-bottom:4px;}
  .sub{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:20px;}
  .top-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;
    border-bottom:1px solid var(--border);margin-bottom:16px;
  }
  #timer{
    font-size:1.3rem;font-weight:700;padding:6px 14px;border-radius:8px;
    background:var(--card);border:1px solid var(--border);min-width:80px;text-align:center;
  }
  #timer.warn{color:var(--red);border-color:var(--red);}
  #score{font-size:1rem;color:var(--muted);}
  #theme-toggle{
    background:var(--card);color:var(--text);border:1px solid var(--border);
    padding:6px 12px;border-radius:8px;font-size:0.85rem;cursor:pointer;
  }
  .item{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:13px 16px;margin-bottom:10px;
    display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;
  }
  .phrase{font-size:1.05rem;line-height:2.1;flex:0 1 auto;}
  .num{color:var(--muted);font-size:0.85rem;margin-right:6px;}
  .def{color:var(--muted);font-size:0.9rem;flex:1 1 200px;}
  input.answer{
    width:112px;padding:5px 8px;border-radius:8px;border:1px solid var(--border);
    background:var(--input-bg);color:var(--text);font-size:1rem;text-align:center;
    outline:none;font-family:inherit;margin:0 3px;
    transition:background .15s,border-color .15s;
  }
  input.answer:focus{border-color:var(--accent);}
  input.answer.correct{background:var(--green-bg);border-color:var(--green);color:var(--green-text);}
  input.answer.incorrect{background:var(--red-bg);border-color:var(--red);color:var(--red-text);}
  input.answer:disabled{opacity:0.8;}
  /* Correct-answer text exists in the markup for reference but is never shown to the learner */
  .reveal{display:none !important;}
  #check-btn{
    display:block;width:100%;background:var(--accent);color:#fff;border:none;
    padding:13px 18px;border-radius:10px;font-size:1rem;font-weight:600;
    cursor:pointer;margin-top:16px;
  }
  #check-btn:hover{opacity:0.9;}
  #check-btn:disabled{opacity:0.5;cursor:not-allowed;}
  #finish-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,11,15,0.55);
    align-items:center;justify-content:center;z-index:20;
  }
  #finish-box{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:28px 30px;text-align:center;max-width:340px;color:var(--text);
  }
  #finish-emoji{font-size:3rem;line-height:1;margin-bottom:6px;}
  #finish-box h2{margin-top:0;margin-bottom:4px;}
  #finish-box p{color:var(--muted);}
  button.primary{
    background:var(--accent);color:#fff;border:none;padding:10px 24px;
    border-radius:8px;font-size:0.95rem;cursor:pointer;margin-top:10px;
  }
  button.primary:hover{opacity:0.9;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Idioms: fill in the missing words</h1>
  <p class="sub">Fill in the missing word in each expression, then press Check. You have 5 minutes.</p>

  <div class="top-bar">
    <div id="timer">05:00</div>
    <div id="score">0 / 10 correct</div>
    <button id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
  </div>

  <div id="quiz"></div>
  <button id="check-btn" onclick="checkAll()">Check</button>
</div>

<div id="finish-overlay">
  <div id="finish-box">
    <div id="finish-emoji">😢</div>
    <h2 id="finish-title">Time's up!</h2>
    <p id="final-score"></p>
    <button class="primary" onclick="document.getElementById('finish-overlay').style.display='none'">OK</button>
  </div>
</div>

<script>
// "{}" marks a gap; answers = accepted words for each gap, in order.
const baseData = [
  { text: "to give something a good {}", answers: [["go"]],
    def: "to try something seriously / make a real effort" },
  { text: "to be/get {} up on", answers: [["hung"]],
    def: "to be overly worried or obsessed about something" },
  { text: "to {} someone’s confidence", answers: [["knock"]],
    def: "to damage or reduce someone’s self-belief" },
  { text: "to throw in the {}", answers: [["towel"]],
    def: "to give up / quit" },
  { text: "to {} in the face of", answers: [["fly"]],
    def: "to completely go against / contradict" },
  { text: "to change {}", answers: [["tack"]],
    def: "to change your approach or method" },
  { text: "to be {} out for", answers: [["cut"]],
    def: "to be naturally suited or qualified for something" },
  { text: "to have a {} share of", answers: [["fair"]],
    def: "to have a reasonable / average amount of" },
  { text: "to make {} in", answers: [["strides"]],
    def: "to make good progress in" },
  { text: "to {} along with", answers: [["go"]],
    def: "to agree to / accept someone’s idea or plan" }
];

// Fisher-Yates shuffle: new order on every page load
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const data = shuffle(baseData);

const scoreMessages = {
  10: ["🏆", "Fantastic job!"],
  9:  ["🤩", "Excellent work!"],
  8:  ["🔥", "Great job!"],
  7:  ["🌟", "Well done!"],
  6:  ["👏", "Nice work!"],
  5:  ["😊", "You're getting there!"],
  4:  ["👍", "Good effort!"],
  3:  ["🙂", "Keep working on it!"],
  2:  ["💪", "Every step counts!"],
  1:  ["🌱", "Keep trying!"],
  0:  ["😢", "Don't give up!"]
};

// Lowercase, trim, drop punctuation, collapse spaces
function normalize(str){
  return str.toLowerCase().replace(/[.,!?;:"'’()]/g, "").replace(/\s+/g, " ").trim();
}

const quizEl = document.getElementById("quiz");
let correctCount = 0;
let timeLeft = 300; // 5 minutes
let timerId = null;
const entries = [];   // { item, gapInputs: [] }
const allInputs = [];

data.forEach((item, idx) => {
  const row = document.createElement("div");
  row.className = "item";

  const phrase = document.createElement("div");
  phrase.className = "phrase";

  const num = document.createElement("span");
  num.className = "num";
  num.textContent = (idx + 1) + ".";
  phrase.appendChild(num);

  const gapInputs = [];
  item.text.split("{}").forEach((part, i, arr) => {
    phrase.appendChild(document.createTextNode(part));
    if (i < arr.length - 1){
      const input = document.createElement("input");
      input.type = "text";
      input.className = "answer";
      input.autocomplete = "off";
      input.autocapitalize = "off";
      input.spellcheck = false;
      // No live validation: colours appear only after Check / when time runs out
      input.addEventListener("input", () => input.classList.remove("correct", "incorrect"));
      input.addEventListener("keydown", e => {
        if (e.key === "Enter"){
          e.preventDefault();
          const pos = allInputs.indexOf(input);
          if (allInputs[pos + 1]) allInputs[pos + 1].focus();
        }
      });
      gapInputs.push(input);
      allInputs.push(input);
      phrase.appendChild(input);
    }
  });

  const def = document.createElement("div");
  def.className = "def";
  def.textContent = "— " + item.def;

  // Kept in the DOM for reference, hidden from the learner via CSS
  const reveal = document.createElement("div");
  reveal.className = "reveal";
  reveal.textContent = "Correct answer: " + item.answers.map(a => a[0]).join(" / ");

  row.appendChild(phrase);
  row.appendChild(def);
  row.appendChild(reveal);
  quizEl.appendChild(row);
  entries.push({ item, gapInputs });
});

function checkAll(){
  let count = 0;
  entries.forEach(({ item, gapInputs }) => {
    let allCorrect = true;
    gapInputs.forEach((inp, g) => {
      const typed = normalize(inp.value);
      if (typed === ""){
        inp.classList.remove("correct", "incorrect");
        allCorrect = false;
        return;
      }
      const ok = item.answers[g].map(normalize).includes(typed);
      inp.classList.toggle("correct", ok);
      inp.classList.toggle("incorrect", !ok);
      if (!ok) allCorrect = false;
    });
    if (allCorrect) count++;
  });
  correctCount = count;
  document.getElementById("score").textContent = correctCount + " / " + data.length + " correct";
}

function formatTime(t){
  const m = Math.floor(t / 60).toString().padStart(2, "0");
  const s = (t % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

function tick(){
  timeLeft--;
  const timerEl = document.getElementById("timer");
  timerEl.textContent = formatTime(Math.max(timeLeft, 0));
  if (timeLeft <= 10) timerEl.classList.add("warn");
  if (timeLeft <= 0){
    clearInterval(timerId);
    endQuiz();
  }
}

function endQuiz(){
  checkAll();
  // Unanswered gaps are marked red at the end so students see what they missed
  allInputs.forEach(inp => {
    if (inp.value.trim() === "") inp.classList.add("incorrect");
    inp.disabled = true;
  });
  document.getElementById("check-btn").disabled = true;

  const [emoji, message] = scoreMessages[correctCount] || scoreMessages[0];
  document.getElementById("finish-emoji").textContent = emoji;
  document.getElementById("finish-title").textContent = message;
  document.getElementById("final-score").textContent =
    "You got " + correctCount + " out of " + data.length + " correct.";
  document.getElementById("finish-overlay").style.display = "flex";
}

function toggleTheme(){
  const html = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  if (html.getAttribute("data-theme") === "light"){
    html.removeAttribute("data-theme");
    btn.textContent = "☀ Light";
  } else {
    html.setAttribute("data-theme", "light");
    btn.textContent = "🌙 Dark";
  }
}

timerId = setInterval(tick, 1000);
</script>
</body>
</html>
